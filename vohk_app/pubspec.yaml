name: vohk_app
description: "Mobile access, intercom, camera, and community management for Vöhk Comunidades."
publish_to: 'none' 
version: 1.0.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0
  http: ^1.2.0
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  #twilio_voice: 0.3.2+2
  twilio_voice:
    path: local_plugins/twilio_voice_vohk/twilio_voice-0.3.2+2
  flutter_local_notifications: ^17.2.1
  wakelock_plus: ^1.2.8
  shared_preferences: ^2.5.3
  flutter_webrtc: ^1.4.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  remove_alpha_ios: true